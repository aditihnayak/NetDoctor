name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run netdoctor lab
      - name: Smoke test (no load test, real network)
        run: uv run netdoctor --no-load --json
        continue-on-error: true   # CI runners often block ICMP / traceroute
  netns-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y traceroute
      - run: uv sync
      - run: sudo lab/netns/lab.sh all
  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run --with pyinstaller python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: netdoctor-${{ matrix.os }}
          path: dist/*
